model = "gpt-5.5"
approval_policy = "on-request"
approvals_reviewer = "user"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

# Project Memory 是 Codex 的主要项目上下文入口。先构建 AgentTools/ProjectMemorySystem。
[mcp_servers.project_memory]
command = "node"
args = ["AgentTools/ProjectMemorySystem/dist/src/mcpServer.js"]
cwd = "."
enabled = true
startup_timeout_sec = 20
tool_timeout_sec = 180
env = { PROJECT_MEMORY_ROOT = ".", PROJECT_MEMORY_CONFIG = "AgentTools/ProjectMemorySystem/ProjectMemory.project.json" }
enabled_tools = [
  "memory_status",
  "build_project_memory",
  "update_project_memory",
  "query_project_memory",
  "get_project_capsule",
  "find_owning_system",
  "find_existing_patterns",
  "get_context_pack",
  "impact_analysis"
]

#请在 AgentTools 目录下运行
# `npm install && npm run build:project-graph` 后，将 enabled 设置为 true。
[mcp_servers.ue_project_graph]
command = "node"
args = ["AgentTools/AgentProjectGraph/ProjectGraph/dist/src/mcpServer.js"]
cwd = "."
enabled = true
startup_timeout_sec = 20
tool_timeout_sec = 180
env = { PROJECT_GRAPH_ROOT = "." }
enabled_tools = [
  "build_project_graph",
  "update_project_graph",
  "find_feature_context",
  "get_context_pack",
  "query_graph",
  "find_asset_references",
  "find_blueprint_usage",
  "impact_analysis"
]

# 面向编辑器的工具
[mcp_servers.ue_editor]
command = "node"
args = ["AgentTools/AgentBlueprintTools/mcp-server/server.js"]
cwd = "."
enabled = true
startup_timeout_sec = 20
tool_timeout_sec = 180
env = { ABT_BRIDGE_URL = "http://127.0.0.1:31055", ABT_BRIDGE_TOKEN = "change-me-local" }
enabled_tools = [
  "ping_ue_bridge",
  "read_blueprint",
  "analyze_blueprint_graph",
  "list_callable_functions",
  "dry_run_blueprint_patch",
  "apply_blueprint_patch",
  "compile_blueprint",
  "read_material",
  "patch_material",
  "analyze_performance",
  "dry_run_performance_optimization",
  "create_asset",
  "import_assets",
  "read_asset",
  "set_asset_property",
  "place_actor"
]
